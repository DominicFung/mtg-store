type Card {
  id: ID!
  name: String!
  isRamp: Boolean!
}

# Shop spools for the deck-box filament preview.
# hex and td shipped in seeds/filaments.json are approximate until measured.
type Filament {
  id: ID!
  name: String!
  hex: String!
  td: Float!
  inStock: Boolean!
  brand: String
  material: String
  finish: String
  sortOrder: Int
  approximate: Boolean
}

# Distances are millimetres. width and height are maximum bounds;
# the deck-box preview fits the crop inside them.
type PrintSettings {
  id: ID!
  layerHeight: Float!
  baseLayerHeight: Float!
  width: Float!
  height: Float!
  nozzleSize: Float!
}

input UpdatePrintSettingsInput {
  layerHeight: Float!
  baseLayerHeight: Float!
  width: Float!
  height: Float!
  nozzleSize: Float!
}

type Query {
  searchCardByName(name: String!): [Card]
  listFilaments: [Filament]
  getPrintSettings: PrintSettings
}

type Mutation {
  updatePrintSettings(input: UpdatePrintSettingsInput!): PrintSettings
}