type Card {
  id: ID!
  name: String!
  isRamp: Boolean!
}

# Shop spools for the deck-box filament preview.
# hex and td shipped in seeds/filaments.json are approximate until measured.
type Filament {
  id: ID!
  name: String!
  hex: String!
  td: Float!
  inStock: Boolean!
  brand: String
  material: String
  finish: String
  sortOrder: Int
  approximate: Boolean
  # Polymer, PLA when the row has no type. Additive; existing items stay valid.
  type: String
}

# Distances are millimetres. height is the shared face height; each crop's
# width follows its aspect. width remains the nominal back-face width.
# minDepth, maxDepth, borderWidth, borderDepth, and detailSize are additive.
type PrintSettings {
  id: ID!
  layerHeight: Float!
  baseLayerHeight: Float!
  width: Float!
  height: Float!
  nozzleSize: Float!
  minDepth: Float!
  maxDepth: Float!
  borderWidth: Float!
  borderDepth: Float!
  detailSize: Float!
}

input UpdatePrintSettingsInput {
  layerHeight: Float!
  baseLayerHeight: Float!
  width: Float!
  height: Float!
  nozzleSize: Float!
  minDepth: Float
  maxDepth: Float
  borderWidth: Float
  borderDepth: Float
  detailSize: Float
}

type Query {
  searchCardByName(name: String!): [Card]
  listFilaments: [Filament]
  getPrintSettings: PrintSettings
}

type Mutation {
  updatePrintSettings(input: UpdatePrintSettingsInput!): PrintSettings
}