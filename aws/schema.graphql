type Card {
  id: ID!
  name: String!
  isRamp: Boolean!
}

# Shop spools for the deck-box filament preview.
# hex and td shipped in seeds/filaments.json are approximate until measured.
type Filament {
  id: ID!
  name: String!
  hex: String!
  td: Float!
  inStock: Boolean!
  brand: String
  material: String
  finish: String
  sortOrder: Int
  approximate: Boolean
  # Polymer, PLA when the row has no type. Additive; existing items stay valid.
  type: String
}

# Distances are millimetres. height is the shared face height; each crop's
# width follows its aspect. width remains the nominal back-face width.
# minDepth, maxDepth, borderWidth, borderDepth, and detailSize are additive.
type PrintSettings {
  id: ID!
  layerHeight: Float!
  baseLayerHeight: Float!
  width: Float!
  height: Float!
  nozzleSize: Float!
  minDepth: Float!
  maxDepth: Float!
  borderWidth: Float!
  borderDepth: Float!
  detailSize: Float!
}

input UpdatePrintSettingsInput {
  layerHeight: Float!
  baseLayerHeight: Float!
  width: Float!
  height: Float!
  nozzleSize: Float!
  minDepth: Float
  maxDepth: Float
  borderWidth: Float
  borderDepth: Float
  detailSize: Float
}

# Nozzle profiles are configurable without a deploy. layerCount is derived.
# Writes are admin-only. Customers can read the active profiles.
type NozzleProfile {
  id: ID!
  name: String!
  nozzleSize: Float!
  layerHeight: Float!
  baseLayerHeight: Float!
  detailSize: Float!
  minDepth: Float!
  maxDepth: Float!
  borderWidth: Float!
  borderDepth: Float!
  brightnessAdjust: Float!
  maxWidth: Float!
  maxHeight: Float!
  nominalWidth: Float!
  active: Boolean!
  isDefault: Boolean!
  layerCount: Int!
  layersAtMaxDepth: Int!
  coreTopMm: Float!
}

input UpsertNozzleProfileInput {
  id: ID
  name: String!
  nozzleSize: Float!
  layerHeight: Float!
  baseLayerHeight: Float!
  detailSize: Float!
  minDepth: Float!
  maxDepth: Float!
  borderWidth: Float!
  borderDepth: Float!
  brightnessAdjust: Float!
  maxWidth: Float!
  maxHeight: Float!
  nominalWidth: Float!
  active: Boolean!
  isDefault: Boolean!
}

type OrderStop {
  filamentId: String!
  name: String!
  hex: String!
  td: Float!
  type: String
  brand: String
  endLayer: Int!
  depthMm: Float!
}

type OrderHistoryEntry {
  status: String!
  at: String!
  actor: String!
  note: String
}

# Shell, lid, spark, and optional name. Additive. Older orders leave it null.
type OrderLid {
  boxFilamentId: String!
  boxFilamentName: String!
  boxHex: String!
  logoFilamentId: String!
  logoFilamentName: String!
  logoHex: String!
  text: String
  textFilamentId: String
  textFilamentName: String
  textHex: String
}

input OrderLidInput {
  boxFilamentId: String!
  logoFilamentId: String!
  text: String
  textFilamentId: String
}

type OrderSummary {
  orderId: ID!
  orderNumber: String!
  email: String!
  name: String!
  status: String!
  createdAt: String!
  updatedAt: String!
  priceLabel: String!
  paymentStatus: String!
  profileName: String!
  nozzleSize: Float!
  layerCount: Int!
  errorMessage: String
  carrier: String
  trackingNumber: String
  note: String
  addressLine1: String
  city: String
  region: String
  postalCode: String
  country: String
}

type OrderDetail {
  orderId: ID!
  orderNumber: String!
  email: String!
  name: String!
  status: String!
  createdAt: String!
  updatedAt: String!
  priceLabel: String!
  paymentStatus: String!
  profileName: String!
  nozzleSize: Float!
  layerCount: Int!
  errorMessage: String
  carrier: String
  trackingNumber: String
  note: String
  addressLine1: String
  city: String
  region: String
  postalCode: String
  country: String
  history: [OrderHistoryEntry!]!
  stops: [OrderStop!]!
  previewUrls: [String!]!
  lid: OrderLid
  downloadUrl: String
  downloadExpiresAt: String
  profileSnapshotJson: String
  deliveryPhotoUrl: String
}

type DeliveryPhotoUpload {
  key: String!
  url: String!
  headersJson: String!
}

type PresignedUpload {
  purpose: String!
  url: String!
  headersJson: String!
}

type SubmitOrderResult {
  orderId: ID!
  orderNumber: String!
  email: String!
  name: String!
  status: String!
  createdAt: String!
  updatedAt: String!
  priceLabel: String!
  paymentStatus: String!
  profileName: String!
  nozzleSize: Float!
  layerCount: Int!
  errorMessage: String
  carrier: String
  trackingNumber: String
  note: String
  addressLine1: String
  city: String
  region: String
  postalCode: String
  country: String
  uploads: [PresignedUpload!]!
}

input OrderStopInput {
  filamentId: String!
  endLayer: Int!
}

input UploadSlotInput {
  width: Int!
  height: Int!
  byteLength: Int!
}

input SubmitOrderInput {
  clientRequestId: String!
  email: String!
  name: String!
  profileId: String!
  note: String
  addressLine1: String
  city: String
  region: String
  postalCode: String
  country: String
  stops: [OrderStopInput!]!
  crops: [UploadSlotInput!]!
  previews: [UploadSlotInput!]!
  # Optional so an older client can still submit. The designer always sends it.
  lid: OrderLidInput
  # "example", "upload", or "scryfall". Missing means upload, which locks the shell to black.
  artSource: String
}

type OutpaintResult {
  imageUrl: String!
  source: String!
  width: Int!
  height: Int!
  # "left" or "right": the side that was extended. The subject stays on the other side.
  side: String!
  # Subject span as fractions of the extended image, so the crop can place them
  # on an outer face without reading a cross-origin bitmap.
  subjectLeft: Float!
  subjectRight: Float!
  subjectCenter: Float!
}

type Query {
  searchCardByName(name: String!): [Card]
  listFilaments: [Filament]
  getPrintSettings: PrintSettings
  listActiveNozzleProfiles: [NozzleProfile!]!
  # Admin. API keys cannot call this.
  listNozzleProfiles: [NozzleProfile!]! @aws_cognito_user_pools(cognito_groups: ["admin"])
  listOrders(status: String, email: String, limit: Int): [OrderSummary!]! @aws_cognito_user_pools(cognito_groups: ["admin"])
  getAdminOrder(orderId: ID!): OrderDetail! @aws_cognito_user_pools(cognito_groups: ["admin"])
  trackOrder(orderNumber: String!, email: String!): OrderDetail!
  # side is "left" or "right" to extend that edge. Omit it and the Lambda picks
  # the empty side, away from the subject. Each side is cached on its own.
  outpaintCommanderArt(imageUrl: String!, side: String): OutpaintResult!
}

type Mutation {
  updatePrintSettings(input: UpdatePrintSettingsInput!): PrintSettings @aws_cognito_user_pools(cognito_groups: ["admin"])
  submitOrder(input: SubmitOrderInput!): SubmitOrderResult!
  confirmOrder(orderNumber: String!, email: String!): OrderSummary!
  updateOrderStatus(orderId: ID!, nextStatus: String!, carrier: String, trackingNumber: String, note: String): OrderSummary! @aws_cognito_user_pools(cognito_groups: ["admin"])
  retryOrderGeneration(orderId: ID!): OrderSummary! @aws_cognito_user_pools(cognito_groups: ["admin"])
  refreshDownloadLinks(orderId: ID!): OrderDetail! @aws_cognito_user_pools(cognito_groups: ["admin"])
  advanceOrder(orderId: ID!): OrderSummary! @aws_cognito_user_pools(cognito_groups: ["admin"])
  undoOrder(orderId: ID!): OrderSummary! @aws_cognito_user_pools(cognito_groups: ["admin"])
  requestDeliveryPhotoUpload(orderId: ID!, contentType: String!, byteLength: Int!): DeliveryPhotoUpload! @aws_cognito_user_pools(cognito_groups: ["admin"])
  confirmDelivery(orderId: ID!, key: String!): OrderSummary! @aws_cognito_user_pools(cognito_groups: ["admin"])
  upsertNozzleProfile(input: UpsertNozzleProfileInput!): NozzleProfile! @aws_cognito_user_pools(cognito_groups: ["admin"])
  deactivateNozzleProfile(id: ID!): NozzleProfile! @aws_cognito_user_pools(cognito_groups: ["admin"])
}
